<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>Gesture Mastery</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}#app{position:relative;width:100%;height:100%;height:100dvh;background:#111;overflow:hidden}#imagem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100vw - 24px);max-height:calc(100dvh - 150px);width:auto;height:auto;object-fit:contain;display:none}#inicio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#aaa}#inicio h1{color:#eee;font-size:clamp(1.4rem,5vw,2rem);margin:0 0 12px}#inicio p{max-width:440px;line-height:1.5;margin:0 0 20px}button{border:1px solid #555;background:#242424;color:#eee;padding:11px 15px;border-radius:10px;font-size:15px;cursor:pointer}button:active{background:#444}#erro{color:#ff9b9b;margin-top:12px;max-width:90%;font-size:14px}#topo{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 6px 12px;background:linear-gradient(rgba(0,0,0,.9),transparent);flex-wrap:nowrap}#tempo{position:static;transform:none;width:auto;flex:0 0 auto;text-align:center;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;pointer-events:none}#configTempo{display:flex;align-items:center;gap:4px;color:#ddd;font-size:13px;flex:0 1 auto;min-width:0}#intervaloSelect,#minutosCustom{border:1px solid #555;background:#242424;color:#eee;border-radius:8px;padding:9px 7px;font-size:14px}#minutosCustom{width:90px}#intervaloSelect{width:128px;padding:9px 6px;font-size:14px}#intervaloSelect:focus,#minutosCustom:focus{outline:none;box-shadow:none;border-color:#555}#idiomas{position:static;display:flex;gap:0;width:max-content;min-width:0;flex:0 0 auto;border:1px solid #555;border-radius:8px;overflow:hidden;justify-content:flex-start}#idiomas button{border:0;border-radius:0;padding:9px 12px;font-size:14px;min-width:44px;background:#242424;color:#aaa}#idiomas button.ativo{background:#333;color:#fff;font-weight:700}#barra{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 10px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85))}#barra button{padding:12px 20px;font-size:20px;min-width:58px}#app:fullscreen{background:#000}.modal-fundo{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.72)}.modal-fundo.escondido{display:none!important}.modal-caixa{width:min(100%,205px);padding:18px;border:1px solid #484848;border-radius:14px;background:#202020;box-shadow:0 14px 42px rgba(0,0,0,.6);text-align:left}.modal-caixa h2{margin:0 0 14px;color:#f2f2f2;font-size:17px;font-weight:650;letter-spacing:.1px}.modal-caixa label{display:block;margin-bottom:6px;color:#bdbdbd;font-size:12px}.modal-caixa input{width:100%;padding:10px 11px;border:1px solid #555;border-radius:8px;background:#141414;color:#eee;font-size:16px;outline:none}.modal-caixa input:focus{border-color:#888;box-shadow:0 0 0 2px rgba(255,255,255,.07)}.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-acoes button{padding:8px 12px;font-size:13px;border-radius:8px}.modal-acoes #confirmarCustom{background:#3a3a3a;color:#fff;border-color:#666}.escondido{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="inicio"><h1>Gesture Mastery</h1><p id="mensagemInicio">Carregando referências...</p><div id="erro" role="status"></div></div>
  <img id="imagem" alt="Imagem da galeria">
  <div id="topo"><label id="configTempo"><span id="rotuloIntervalo">Intervalo</span> <select id="intervaloSelect"><option value=15>15 s</option><option value=30>30 s</option><option value=45>45 s</option><option value=60 selected>1 min</option><option value=120>2 min</option><option value=300>5 min</option><option value=custom>Personalizado</option></select></label><span id="tempo">1:00</span><div id="idiomas" aria-label="Language"><button type="button" id="idiomaPT" class="ativo" aria-pressed="true">PT</button><button type="button" id="idiomaEN" aria-pressed="false">EN</button></div></div><div id="barra"><button id="anterior" aria-label="Foto anterior">◀</button><button id="proxima" aria-label="Próxima foto">▶</button></div>
  <div id="modalCustom" class="modal-fundo escondido" role="dialog" aria-modal="true" aria-labelledby="tituloCustom">
    <div class="modal-caixa">
      <h2 id="tituloCustom">Intervalo personalizado</h2>
      <label id="rotuloCustom" for="valorCustom">Duração em minutos</label>
      <input id="valorCustom" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="Minutos">
      <div class="modal-acoes"><button type="button" id="cancelarCustom">Cancelar</button><button type="button" id="confirmarCustom">Confirmar</button></div>
    </div>
  </div>
</div>
<script>
let imagens=[],atual=-1,segundos=60,duracao=60,intervalo=null,idioma=localStorage.getItem('gesture-mastery-idioma')||'pt',ordem=[],posicao=0;
const img=document.getElementById('imagem'),tempo=document.getElementById('tempo'),inicio=document.getElementById('inicio'),erro=document.getElementById('erro'),intervaloSelect=document.getElementById('intervaloSelect');
function aplicarIdioma(){
 const en=idioma==='en',op=intervaloSelect.options;
 document.documentElement.lang=en?'en':'pt-BR';
 document.getElementById('rotuloIntervalo').textContent=en?'Interval':'Intervalo';
 ['15 seconds','30 seconds','45 seconds','1 minute','2 minutes','5 minutes','Custom'].forEach((v,i)=>op[i].textContent=en?v:['15 segundos','30 segundos','45 segundos','1 minuto','2 minutos','5 minutos','Personalizado'][i]);
 document.getElementById('mensagemInicio').textContent=en?'Loading references...':'Carregando referências...';
 document.getElementById('imagem').alt=en?'Gesture drawing reference':'Referência para desenho gestual';
 document.getElementById('anterior').setAttribute('aria-label',en?'Previous image':'Imagem anterior');
 document.getElementById('proxima').setAttribute('aria-label',en?'Next image':'Próxima imagem');
 document.getElementById('idiomaPT').classList.toggle('ativo',!en);document.getElementById('idiomaEN').classList.toggle('ativo',en);
 document.getElementById('idiomaPT').setAttribute('aria-pressed',String(!en));document.getElementById('idiomaEN').setAttribute('aria-pressed',String(en));
 atualizarTextoModal();
}
document.getElementById('idiomaPT').onclick=()=>{idioma='pt';localStorage.setItem('gesture-mastery-idioma',idioma);aplicarIdioma()};
document.getElementById('idiomaEN').onclick=()=>{idioma='en';localStorage.setItem('gesture-mastery-idioma',idioma);aplicarIdioma()};
function atualizarTempo(){tempo.textContent=Math.floor(segundos/60)+':'+String(segundos%60).padStart(2,'0')}
function embaralhar(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function proximaAleatoria(){
 if(posicao>=ordem.length){ordem=imagens.map((_,i)=>i);embaralhar(ordem);if(ordem.length>1&&ordem[0]===atual)[ordem[0],ordem[1]]=[ordem[1],ordem[0]];posicao=0}
 mostrar(ordem[posicao++]);
}
const imagensPreparadas=new Map();
function prepararImagem(indice){
 if(!imagens.length)return;
 indice=(indice+imagens.length)%imagens.length;
 const url=imagens[indice];
 if(imagensPreparadas.has(url))return;
 const pre=new Image();
 pre.decoding='async';
 pre.src=url;
 imagensPreparadas.set(url,pre);
 if(imagensPreparadas.size>4){
  const primeira=imagensPreparadas.keys().next().value;
  if(primeira!==img.src)imagensPreparadas.delete(primeira);
 }
}
function mostrar(n){
 if(!imagens.length)return;
 atual=(n+imagens.length)%imagens.length;
 const url=imagens[atual];
 const pronta=imagensPreparadas.get(url);
 img.src=pronta?pronta.src:url;
 img.style.display='block';
 inicio.style.display='none';
 segundos=duracao;atualizarTempo();
 prepararImagem(atual+1);
 prepararImagem(atual-1);
 clearInterval(intervalo);
 intervalo=setInterval(()=>{segundos--;atualizarTempo();if(segundos<=0)proximaAleatoria()},1000);
}
async function carregarBanco(){
 try{
  const resposta=await fetch('https://api.github.com/repos/antonyvinco/gesture-mastery/contents/imagens',{cache:'no-store'});
  if(!resposta.ok)throw new Error('Não foi possível acessar o banco de imagens.');
  const arquivos=await resposta.json();
  imagens=arquivos.filter(f=>f.type==='file'&&/\.(jpe?g|png|webp|avif)$/i.test(f.name)).map(f=>f.download_url);
  if(!imagens.length){document.getElementById('mensagemInicio').textContent=idioma==='en'?'Your image library is empty. Add JPG images to the imagens folder on GitHub.':'Seu banco ainda está vazio. Adicione imagens JPG à pasta imagens no GitHub.';return}
  ordem=imagens.map((_,i)=>i);embaralhar(ordem);proximaAleatoria();
 }catch(e){document.getElementById('mensagemInicio').textContent=idioma==='en'?'Could not load the image library. Check your internet connection.':'Não foi possível carregar o banco de imagens. Verifique sua conexão.';erro.textContent=e.message}
}
let ultimoIntervalo='60';
const modalCustom=document.getElementById('modalCustom'),valorCustom=document.getElementById('valorCustom');
function definirDuracao(n){duracao=n;if(atual>=0)mostrar(atual);else{segundos=duracao;atualizarTempo()}}
function fecharModalCustom(){modalCustom.classList.add('escondido')}
function abrirModalCustom(){valorCustom.value=String(Math.max(1,Math.round(duracao/60)));modalCustom.classList.remove('escondido');valorCustom.focus()}
function atualizarTextoModal(){const en=idioma==='en';document.getElementById('tituloCustom').textContent=en?'Enter the interval':'Digite o intervalo';document.getElementById('rotuloCustom').textContent=en?'Set the interval':'Defina o intervalo';valorCustom.placeholder=en?'Minutes':'Minutos';document.getElementById('cancelarCustom').textContent=en?'Cancel':'Cancelar';document.getElementById('confirmarCustom').textContent=en?'Confirm':'Confirmar'}
intervaloSelect.onchange=()=>{if(intervaloSelect.value==='custom')abrirModalCustom();else{ultimoIntervalo=intervaloSelect.value;definirDuracao(Number(intervaloSelect.value))}};
document.getElementById('cancelarCustom').onclick=()=>{intervaloSelect.value=ultimoIntervalo;fecharModalCustom()};
document.getElementById('confirmarCustom').onclick=()=>{const m=Number(valorCustom.value);if(!Number.isInteger(m)||m<1||m>1440){valorCustom.focus();return}ultimoIntervalo='custom';definirDuracao(m*60);fecharModalCustom()};
valorCustom.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('confirmarCustom').click();if(e.key==='Escape')document.getElementById('cancelarCustom').click()});
modalCustom.addEventListener('click',e=>{if(e.target===modalCustom)document.getElementById('cancelarCustom').click()});
document.getElementById('anterior').onclick=()=>mostrar(atual-1);
document.getElementById('proxima').onclick=()=>proximaAleatoria();
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')mostrar(atual-1);if(e.key==='ArrowRight')proximaAleatoria()});
aplicarIdioma();atualizarTempo();carregarBanco();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{}))}
</script>
</body>
</html>
