<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<title>Gesture Mastery</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}#app{position:relative;width:100%;height:100%;height:100dvh;background:#111;overflow:hidden}#imagem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:calc(100vw - 24px);max-height:calc(100dvh - 150px);width:auto;height:auto;object-fit:contain;display:none}#inicio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#aaa}#inicio h1{color:#eee;font-size:clamp(1.4rem,5vw,2rem);margin:0 0 12px}#inicio p{max-width:440px;line-height:1.5;margin:0 0 20px}button{border:1px solid #555;background:#242424;color:#eee;padding:11px 15px;border-radius:10px;font-size:15px;cursor:pointer}button:active{background:#444}#erro{color:#ff9b9b;margin-top:12px;max-width:90%;font-size:14px}#topo{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 6px 12px;background:linear-gradient(rgba(0,0,0,.9),transparent);flex-wrap:nowrap}#tempo{position:static;transform:none;width:auto;flex:0 0 auto;text-align:center;font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;pointer-events:none}#configTempo{display:flex;align-items:center;gap:4px;color:#ddd;font-size:13px;flex:0 1 auto;min-width:0}#intervaloSelect,#minutosCustom{border:1px solid #555;background:#242424;color:#eee;border-radius:8px;padding:9px 7px;font-size:14px}#minutosCustom{width:90px}#intervaloSelect{width:128px;padding:9px 6px;font-size:14px}#intervaloSelect:focus,#minutosCustom:focus{outline:none;box-shadow:none;border-color:#555}#idiomas{position:static;display:flex;gap:0;width:max-content;min-width:0;flex:0 0 auto;border:1px solid #555;border-radius:8px;overflow:hidden;justify-content:flex-start}#idiomas button{border:0;border-radius:0;padding:9px 12px;font-size:14px;min-width:44px;background:#242424;color:#aaa}#idiomas button.ativo{background:#333;color:#fff;font-weight:700}#barra{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:24px;padding:12px 10px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85))}#barra button{padding:12px 20px;font-size:20px;min-width:58px}#app:fullscreen{background:#000}.modal-fundo{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.72)}.modal-fundo.escondido{display:none!important}.modal-caixa{width:min(100%,280px);padding:18px;border:1px solid #484848;border-radius:14px;background:#202020;box-shadow:0 14px 42px rgba(0,0,0,.6);text-align:left}.modal-caixa h2{margin:0 0 14px;color:#f2f2f2;font-size:17px;font-weight:650;letter-spacing:.1px}.modal-caixa label{display:block;margin-bottom:6px;color:#bdbdbd;font-size:12px}.modal-caixa input{width:100%;padding:10px 11px;border:1px solid #555;border-radius:8px;background:#141414;color:#eee;font-size:16px;outline:none}.modal-caixa input:focus{border-color:#888;box-shadow:0 0 0 2px rgba(255,255,255,.07)}.modal-acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-acoes button{padding:8px 12px;font-size:13px;border-radius:8px}.modal-acoes #confirmarCustom{background:#3a3a3a;color:#fff;border-color:#666}.escondido{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="inicio"><h1>Gesture Mastery</h1><p>Escolha uma pasta de imagens, se o navegador permitir, ou selecione várias fotos. A galeria alternará automaticamente.</p><button id="escolher">Selecionar pasta</button><button id="selecionarArquivos" style="margin-top:10px">Selecionar imagens</button><div id="erro" role="status"></div></div>
  <img id="imagem" alt="Imagem da galeria">
  <div id="topo"><label id="configTempo"><span id="rotuloIntervalo">Intervalo</span> <select id="intervaloSelect"><option value=15>15 s</option><option value=30>30 s</option><option value=60 selected>1 min</option><option value=120>2 min</option><option value=300>5 min</option><option value=custom>Personalizado</option></select></label><span id="tempo">1:00</span><div id="idiomas" aria-label="Language"><button type="button" id="idiomaPT" class="ativo" aria-pressed="true">PT</button><button type="button" id="idiomaEN" aria-pressed="false">EN</button></div></div><div id="barra"><button id="anterior" aria-label="Foto anterior">◀</button><button id="proxima" aria-label="Próxima foto">▶</button></div>
  <div id="modalCustom" class="modal-fundo escondido" role="dialog" aria-modal="true" aria-labelledby="tituloCustom">
    <div class="modal-caixa">
      <h2 id="tituloCustom">Intervalo personalizado</h2>
      <label id="rotuloCustom" for="valorCustom">Duração em minutos</label>
      <input id="valorCustom" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="Minutos">
      <div class="modal-acoes"><button type="button" id="cancelarCustom">Cancelar</button><button type="button" id="confirmarCustom">Confirmar</button></div>
    </div>
  </div>
  <input id="arquivos" type="file" accept="image/*" multiple class="escondido">
  <input id="pastaMobile" type="file" accept="image/*" multiple webkitdirectory directory class="escondido">
</div>
<script>
let imagens=[],atual=-1,segundos=60,duracao=60,intervalo=null;
const app=document.getElementById('app'),img=document.getElementById('imagem'),tempo=document.getElementById('tempo'),inicio=document.getElementById('inicio'),erro=document.getElementById('erro'),arquivos=document.getElementById('arquivos'),pastaMobile=document.getElementById('pastaMobile'),intervaloSelect=document.getElementById('intervaloSelect');
let idioma=localStorage.getItem('gesture-mastery-idioma')||'pt';
function aplicarIdioma(){
 const en=idioma==='en';
 document.documentElement.lang=en?'en':'pt-BR';
 document.getElementById('rotuloIntervalo').textContent=en?'Interval':'Intervalo';
 const opcoes=intervaloSelect.options;
 opcoes[0].textContent=en?'15 seconds':'15 segundos';
 opcoes[1].textContent=en?'30 seconds':'30 segundos';
 opcoes[2].textContent=en?'1 minute':'1 minuto';
 opcoes[3].textContent=en?'2 minutes':'2 minutos';
 opcoes[4].textContent=en?'5 minutes':'5 minutos';
 opcoes[5].textContent=en?'Custom':'Personalizado';
 document.querySelector('#inicio p').textContent=en?'Choose an image folder, if your browser allows it, or select multiple photos. The gallery will switch automatically.':'Escolha uma pasta de imagens, se o navegador permitir, ou selecione várias fotos. A galeria alternará automaticamente.';
 document.getElementById('escolher').textContent=en?'Select folder':'Selecionar pasta';
 document.getElementById('selecionarArquivos').textContent=en?'Select images':'Selecionar imagens';
 document.getElementById('imagem').alt=en?'Gallery image':'Imagem da galeria';
 document.getElementById('anterior').setAttribute('aria-label',en?'Previous photo':'Foto anterior');
 document.getElementById('proxima').setAttribute('aria-label',en?'Next photo':'Próxima foto');
 document.getElementById('idiomaPT').classList.toggle('ativo',!en);
 document.getElementById('idiomaEN').classList.toggle('ativo',en);
 document.getElementById('idiomaPT').setAttribute('aria-pressed',String(!en));
 document.getElementById('idiomaEN').setAttribute('aria-pressed',String(en));
}
document.getElementById('idiomaPT').onclick=()=>{idioma='pt';localStorage.setItem('gesture-mastery-idioma',idioma);aplicarIdioma()};
document.getElementById('idiomaEN').onclick=()=>{idioma='en';localStorage.setItem('gesture-mastery-idioma',idioma);aplicarIdioma()};
function atualizarTempo(){tempo.textContent=Math.floor(segundos/60)+':'+String(segundos%60).padStart(2,'0')}
aplicarIdioma();
function embaralhar(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function mostrar(n){if(!imagens.length)return;atual=(n+imagens.length)%imagens.length;img.src=imagens[atual];img.style.display='block';inicio.style.display='none';segundos=duracao;atualizarTempo();clearInterval(intervalo);intervalo=setInterval(()=>{segundos--;atualizarTempo();if(segundos<=0){if(imagens.length===1)mostrar(atual);else{let p;do{p=Math.floor(Math.random()*imagens.length)}while(p===atual);mostrar(p)}}},1000)}
function carregarLista(lista){const validos=Array.from(lista).filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(f.name));if(!validos.length){erro.textContent=idioma==='en'?'No images found in the selection.':'Não encontrei imagens na seleção.';return}imagens.forEach(u=>URL.revokeObjectURL(u));const chave=f=>`${f.name}|${f.size}|${f.lastModified}`;const ultimaInicial=localStorage.getItem('gesture-mastery-ultima-inicial');embaralhar(validos);if(validos.length>1&&chave(validos[0])===ultimaInicial){const diferente=validos.findIndex(f=>chave(f)!==ultimaInicial);if(diferente>0)[validos[0],validos[diferente]]=[validos[diferente],validos[0]]}localStorage.setItem('gesture-mastery-ultima-inicial',chave(validos[0]));imagens=validos.map(f=>URL.createObjectURL(f));erro.textContent='';mostrar(0)}
document.getElementById('escolher').onclick=async()=>{erro.textContent='';if(window.showDirectoryPicker){try{const dir=await window.showDirectoryPicker();const lista=[];for await(const [,handle] of dir.entries()){if(handle.kind==='file'){const f=await handle.getFile();if(f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(f.name))lista.push(f)}}carregarLista(lista);return}catch(e){if(e.name==='AbortError')return;erro.textContent=idioma==='en'?'The browser could not select the folder. Try selecting images individually or use the alternate folder button.':'O navegador não conseguiu selecionar a pasta. Tente selecionar imagens individualmente ou use o botão de pasta alternativo.'}}
pastaMobile.click()};
document.getElementById('selecionarArquivos').onclick=()=>arquivos.click();arquivos.onchange=()=>{if(arquivos.files?.length)carregarLista(arquivos.files);arquivos.value=''};pastaMobile.onchange=()=>{if(pastaMobile.files?.length)carregarLista(pastaMobile.files);pastaMobile.value=''};
let ultimoIntervalo='60';
const modalCustom=document.getElementById('modalCustom'),valorCustom=document.getElementById('valorCustom');
function definirDuracao(novaDuracao){duracao=novaDuracao;if(atual>=0)mostrar(atual);else{segundos=duracao;atualizarTempo()}}
function fecharModalCustom(){modalCustom.classList.add('escondido')}
function abrirModalCustom(){valorCustom.value=String(Math.max(1,Math.round(duracao/60)));modalCustom.classList.remove('escondido');valorCustom.focus()}
function atualizarTextoModal(){const en=idioma==='en';document.getElementById('tituloCustom').textContent=en?'Enter the interval':'Digite o intervalo';document.getElementById('rotuloCustom').textContent=en?'Minutes':'Minutos';valorCustom.placeholder=en?'Minutes':'Minutos';document.getElementById('cancelarCustom').textContent=en?'Cancel':'Cancelar';document.getElementById('confirmarCustom').textContent=en?'Confirm':'Confirmar'}
const aplicarIdiomaOriginal=aplicarIdioma;
aplicarIdioma=function(){aplicarIdiomaOriginal();atualizarTextoModal()};
atualizarTextoModal();
intervaloSelect.onchange=()=>{
 if(intervaloSelect.value==='custom'){abrirModalCustom()}
 else{ultimoIntervalo=intervaloSelect.value;definirDuracao(Number(intervaloSelect.value))}
};
document.getElementById('cancelarCustom').onclick=()=>{intervaloSelect.value=ultimoIntervalo;fecharModalCustom()};
document.getElementById('confirmarCustom').onclick=()=>{
 const minutos=Number(valorCustom.value);
 if(!Number.isInteger(minutos)||minutos<1||minutos>1440){valorCustom.focus();valorCustom.setCustomValidity(idioma==='en'?'Enter a whole number from 1 to 1440.':'Digite um número inteiro entre 1 e 1440.');valorCustom.reportValidity();return}
 valorCustom.setCustomValidity('');ultimoIntervalo='custom';definirDuracao(minutos*60);fecharModalCustom()
};
valorCustom.addEventListener('input',()=>valorCustom.setCustomValidity(''));
valorCustom.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('confirmarCustom').click();if(e.key==='Escape')document.getElementById('cancelarCustom').click()});
modalCustom.addEventListener('click',e=>{if(e.target===modalCustom)document.getElementById('cancelarCustom').click()});
document.getElementById('anterior').onclick=()=>mostrar(atual-1);document.getElementById('proxima').onclick=()=>mostrar(atual+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')mostrar(atual-1);if(e.key==='ArrowRight')mostrar(atual+1)});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
